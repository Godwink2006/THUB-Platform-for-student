<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/notifications.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="app-container">

      <main class="main-content notifications-page">
        <div class="notifications-header">
          <h1 class="page-title">Notifications</h1>
        </div>

        <div class="notif-tabs-container">
          <div class="notif-filter-tabs" role="group" aria-label="Filter notifications">
            <button class="notif-tab active" data-filter="all">All</button>
            <button class="notif-tab" data-filter="unread">Unread</button>
            <button class="notif-tab" data-filter="read">Read</button>
          </div>
          <button id="markAllReadBtn" class="btn-primary-action">
            <i class="fa-solid fa-check-double" aria-hidden="true"></i>
            <span>Mark all read</span>
          </button>
          <button id="refreshNotifications" class="notifications-refresh-button" type="button" aria-label="Refresh notifications">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            <span>Refresh</span>
          </button>
        </div>

        <div id="fullNotificationList" class="notifications-card-list">
          <div class="notifications-loading-state">
            <i class="fa-solid fa-spinner fa-spin notification-loading-icon" aria-hidden="true"></i>
            Loading notifications...
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/student-page-cache.js"></script>
    <script src="/js/notifications.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
