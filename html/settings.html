<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/utils.css" />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="academics-container">
      <main class="settings-main-content">
        <header class="settings-school-header">
          <img
            class="settings-school-photo"
            id="settingsSchoolPhoto"
            src="/icons/school-avatar-default.svg"
            alt="School photo"
            style="visibility:hidden"
            onerror="this.onerror=null;this.src='/icons/school-avatar-default.svg'"
          />
          <h1 id="settingsSchoolName">My School</h1>
          <p id="settingsSchoolMotto"></p>
          <button id="refreshSettingsSchool" class="settings-refresh-button" type="button" aria-label="Refresh school information">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            <span>Refresh</span>
          </button>
        </header>

        <script>
          (async () => {
            const photo = document.getElementById("settingsSchoolPhoto");
            const showFallback = () => { if (photo) photo.style.visibility = "visible"; };
            try {
              const pageKey = "thubStudentPageCache:v1:settings-school";
              const sessions = Object.keys(localStorage).filter((key) => {
                if (!key.startsWith("sb-") || !key.endsWith("-auth-token")) return false;
                return true;
              });
              const currentUserId = sessions.map((key) => {
                try { return JSON.parse(localStorage.getItem(key) || "null")?.user?.id || ""; }
                catch { return ""; }
              }).find(Boolean);
              if (!currentUserId) { showFallback(); return; }

              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open("thub-student-app-cache", 1);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
                request.onupgradeneeded = () => request.transaction.abort();
              });
              const lastUserRecord = await new Promise((resolve, reject) => {
                const request = db.transaction("entries", "readonly").objectStore("entries").get(`${pageKey}:last-user`);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
              const cachedUserId = lastUserRecord?.value;
              if (cachedUserId !== currentUserId) { db.close(); showFallback(); return; }
              const cacheKey = `${pageKey}:${cachedUserId}`;
              const cachedRecord = await new Promise((resolve, reject) => {
                const request = db.transaction("entries", "readonly").objectStore("entries").get(cacheKey);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
              db.close();
              const cached = JSON.parse(cachedRecord?.value || "null");
              const school = cached?.userId === cachedUserId ? cached.data : null;
              if (!school) { showFallback(); return; }
              document.getElementById("settingsSchoolName").textContent = school.schoolName || "My School";
              const motto = document.getElementById("settingsSchoolMotto");
              motto.textContent = school.schoolMotto || "";
              motto.hidden = !school.schoolMotto;
              photo.onload = showFallback;
              photo.onerror = () => {
                photo.src = "/icons/school-avatar-default.svg";
                showFallback();
              };
              photo.src = school.logoUrl || "/icons/school-avatar-default.svg";
              photo.alt = `${school.schoolName || "School"} photo`;
              photo.dataset.hydrated = "true";
            } catch {
              showFallback();
            }
          })();
        </script>

        <section class="setting-cards" id="settingsContainer"></section>
      </main>
    </div>

    <div id="clearDataDialog" class="clear-data-modal" aria-hidden="true" hidden>
      <section
        class="clear-data-card"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="clearDataDialogTitle"
        aria-describedby="clearDataDialogDescription"
        tabindex="-1"
      >
        <div class="clear-data-icon" aria-hidden="true">
          <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <h2 id="clearDataDialogTitle">Log out?</h2>
        <p id="clearDataDialogDescription">
          This signs you out on this device.
        </p>
        <div class="clear-data-actions">
          <button id="cancelClearDataBtn" type="button" class="clear-data-cancel">
            Cancel
          </button>
          <button id="confirmClearDataBtn" type="button" class="clear-data-confirm">
            Log Out
          </button>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/student-page-cache.js"></script>
    <script src="/js/push-config.js"></script>
    <script src="/js/settings.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
