<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/utils.css" />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="academics-container">
      <main class="settings-main-content">
        <header class="topbar">
          <div>
            <h1>Settings</h1>
            <p>Configure settings.</p>
          </div>
        </header>

        <div id="settingsSkeleton" class="setting-cards">
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
          <div class="setting-card skeleton">
            <div class="skeleton-title"></div>
            <div class="skeleton-text"></div>
            <div class="skeleton-btn"></div>
          </div>
        </div>

        <section
          class="setting-cards"
          id="settingsContainer"
          style="display: none"
        ></section>
      </main>
    </div>

    <div id="clearDataDialog" class="clear-data-modal" aria-hidden="true" hidden>
      <section
        class="clear-data-card"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="clearDataDialogTitle"
        aria-describedby="clearDataDialogDescription"
        tabindex="-1"
      >
        <div class="clear-data-icon" aria-hidden="true">
          <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <h2 id="clearDataDialogTitle">Log out?</h2>
        <p id="clearDataDialogDescription">
          This signs you out on this device.
        </p>
        <div class="clear-data-actions">
          <button id="cancelClearDataBtn" type="button" class="clear-data-cancel">
            Cancel
          </button>
          <button id="confirmClearDataBtn" type="button" class="clear-data-confirm">
            Log Out
          </button>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/push-config.js"></script>
    <script src="/js/settings.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
