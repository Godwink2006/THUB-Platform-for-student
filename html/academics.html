<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/academics.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/utils.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="academics-container">
      <main class="academics-main-content">
        <header class="academics-profile-header">
          <div class="academics-photo-stack" aria-label="Student and school photos">
            <img
              id="academicsSchoolPhoto"
              class="academics-school-photo"
              src="/icons/school-avatar-default.svg"
              alt="School photo"
              onerror="this.onerror=null;this.src='/icons/school-avatar-default.svg'"
            />
            <img
              id="academicsStudentPhoto"
              class="academics-student-photo"
              src="/icons/student-avatar-default.svg"
              alt="Student photo"
              onerror="this.onerror=null;this.src='/icons/student-avatar-default.svg'"
            />
          </div>
          <p class="academics-user-email" id="academicsUserEmail"></p>
          <button id="refreshAcademics" class="academics-refresh-button" type="button" aria-label="Refresh student and school photos">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            <span>Refresh</span>
          </button>
        </header>

        <section
          class="academic-links-card"
          id="academicsContainer"
          aria-label="Academic records"
        ></section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/student-page-cache.js"></script>
    <script src="/js/academics.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
