<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/school-informations.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <section class="settings-page" id="schoolInformationPage">
      <div class="page-header">
        <h2>School Information</h2>
      </div>

      <div id="formLoader" class="form-loader">
        <div class="spinner"></div>
        <p>Loading school information…</p>
      </div>

      <div id="schoolInformationNotice" class="school-information-notice" role="status" hidden></div>

      <div id="schoolInformationView" class="school-information-view" hidden>
        <div class="school-profile-intro">
          <img
            id="schoolLogoPreview"
            class="school-logo"
            src="/icons/school-avatar-default.svg"
            alt="School logo"
            onerror="this.onerror = null; this.src = '/icons/school-avatar-default.svg';"
          />
          <div>
            <h1 id="schoolNameValue">—</h1>
            <p id="schoolMottoValue" class="school-motto">—</p>
          </div>
        </div>

        <div class="school-details-card">
          <section class="school-info-section" aria-labelledby="generalInfoHeading">
            <h2 id="generalInfoHeading"><i class="fa-solid fa-building-columns" aria-hidden="true"></i> General information</h2>
            <dl class="school-info-list">
              <div class="school-info-item"><dt>Email</dt><dd id="schoolEmailValue">—</dd></div>
              <div class="school-info-item"><dt>Alternative phone</dt><dd id="alternativePhoneValue">—</dd></div>
              <div class="school-info-item"><dt>Website</dt><dd id="schoolWebsiteValue">—</dd></div>
              <div class="school-info-item school-info-item-wide"><dt>Address</dt><dd id="schoolAddressValue">—</dd></div>
              <div class="school-info-item"><dt>City</dt><dd id="schoolCityValue">—</dd></div>
              <div class="school-info-item"><dt>Country</dt><dd id="schoolCountryValue">—</dd></div>
            </dl>
          </section>

          <section class="school-info-section" aria-labelledby="leadershipHeading">
            <h2 id="leadershipHeading"><i class="fa-solid fa-user-tie" aria-hidden="true"></i> Principal / Head Teacher</h2>
            <dl class="school-info-list">
              <div class="school-info-item"><dt>Full name</dt><dd id="principalNameValue">—</dd></div>
              <div class="school-info-item"><dt>Email</dt><dd id="principalEmailValue">—</dd></div>
              <div class="school-info-item"><dt>Phone number</dt><dd id="principalPhoneValue">—</dd></div>
            </dl>
          </section>

          <section class="school-info-section" aria-labelledby="schoolDetailsHeading">
            <h2 id="schoolDetailsHeading"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i> School details</h2>
            <dl class="school-info-list">
              <div class="school-info-item"><dt>School type</dt><dd id="schoolTypeValue">—</dd></div>
              <div class="school-info-item"><dt>Education level</dt><dd id="educationLevelValue">—</dd></div>
            </dl>
          </section>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/school-information.js"></script>
    <script src="/js/app-icons.js"></script>
  </body>
</html>
