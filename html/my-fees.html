<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/my-fees.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-section">
        <h1>School Fees & Payment History</h1>
      </div>

      <div class="toolbar" aria-label="Filter fee records">
        <div class="filter-group">
          <select
            id="filterAcademicYear"
            class="form-control"
            aria-label="Filter by academic year"
          >
            <option value="">All Academic Years</option>
          </select>
        </div>

        <div class="filter-group">
          <select
            id="filterClass"
            class="form-control"
            aria-label="Filter by class"
          >
            <option value="">All Classes</option>
          </select>
        </div>

        <div class="filter-group">
          <select
            id="filterTerm"
            aria-label="Filter by semester"
            class="form-control"
          >
            <option value="">All Semesters</option>
            <option value="1">1st Semester</option>
            <option value="2">2nd Semester</option>
          </select>
        </div>
        <button id="refreshStudentFees" type="button" class="fees-refresh-button" aria-label="Refresh fee records">
          <i class="fa-solid fa-rotate" aria-hidden="true"></i>
          <span>Refresh</span>
        </button>
      </div>

      <div class="card">
        <h2>Fee Structures & Balances</h2>
        <div id="studentFeesContainer">
          <div class="empty-state">Loading your fee records...</div>
        </div>
      </div>

      <div class="card">
        <h2>Payment Transaction History</h2>
        <div id="paymentTransactionsContainer">
          <div class="empty-state">Loading your payment history...</div>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/student-page-cache.js"></script>
    <script src="/js/transfer-history-index.js"></script>
    <script src="/js/my-fees.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
