<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>High School Management System</title>
    <link rel="stylesheet" href="/css/books.css" />
    <link rel="preconnect" href="https://fontsgoogleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/utils.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
      <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
      <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body>
    <div class="students-container">
      <main class="students-main-content">
        <div id="booksPageNotice" class="books-page-notice" role="status" aria-live="polite" hidden></div>

        <div class="catalog-container" id="booksCatalog" hidden>

          <div class="catalog-header">
            <h2>Library Catalog</h2>
            <div class="catalog-search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="catalogSearchInput"
                placeholder="Search by title, author, or category..."
              />
            </div>
          </div>

          <div id="bookCardGrid" class="book-card-grid">

          </div>
          <div class="books-pagination">
            <button id="nextBooksPage" type="button" hidden>Next</button>
          </div>
        </div>
      </main>
    </div>

    <div
      id="studentHistoryModal"
      class="student-modal-overlay"
      style="display: none"
    >
      <div class="student-modal-card">
        <div class="student-modal-header">
          <h3>My Borrowing History</h3>
          <button
            class="student-modal-close-btn"
            onclick="closeStudentHistoryModal()"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="studentHistoryContent" class="student-modal-body">

        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/books.js"></script>
      <script src="/js/app-icons.js"></script>
  </body>
</html>
