<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | T-HUB</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="stylesheet" href="/css/app-visuals.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div class="dashboard-container">
      <main class="dashboard-main-content">
        <header class="dashboard-profile-header">
          <img
            class="dashboard-profile-photo"
            id="dashboardStudentPhoto"
            src=""
            alt="Student profile"
            onerror="this.onerror=null;this.src=window.DEFAULT_PROFILE_AVATAR"
          />
          <h1 class="dashboard-profile-name" id="dashboardStudentName">Student</h1>
        </header>

        <section class="student-attendance-card" aria-labelledby="studentAttendanceHeading">
          <div class="student-attendance-icon" aria-hidden="true"><i class="fa-solid fa-calendar-check"></i></div>
          <div class="student-attendance-copy">
            <h2 id="studentAttendanceHeading">Attendance</h2>
            <p id="studentAttendanceDetail" aria-live="polite">Loading your attendance...</p>
          </div>
          <strong class="student-attendance-rate" id="studentAttendanceRate" aria-label="Attendance rate">—</strong>
        </section>

        <section class="announcement-cards" aria-labelledby="announcementsHeading">
          <div class="card-header">
            <h3 id="announcementsHeading"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> School Announcements</h3>
          </div>
          <div class="announcement-preview" id="announcementPreviewContainer" aria-live="polite">
            <div class="announcement-item"><p>Loading announcements...</p></div>
          </div>
        </section>
      </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/app-icons.js"></script>
  </body>
</html>
