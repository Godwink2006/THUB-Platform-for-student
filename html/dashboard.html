<!doctype html>
<html lang="en" class="auth-welcome-open">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard | T-HUB</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="stylesheet" href="/css/app-visuals.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body class="dashboard-auth-checking">
    <div id="dashboardAuthLoading" class="dashboard-auth-loading" role="status" aria-live="polite">
      <div class="dashboard-auth-loading__content">
        <img class="dashboard-auth-loading__logo" src="/icons/app-icon-192.png" alt="" />
        <h1>T-HUB</h1>
      </div>
    </div>

    <div class="dashboard-container">
      <main class="dashboard-main-content">
        <header class="topbar">
          <div>
            <h1>Student Dashboard</h1>
            <p id="welcomeUserText">Welcome back...</p>
          </div>
        </header>

        <section class="announcement-cards" aria-labelledby="announcementsHeading">
          <div class="card-header">
            <h3 id="announcementsHeading"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> School Announcements</h3>
          </div>
          <div class="announcement-preview" id="announcementPreviewContainer" aria-live="polite">
            <div class="announcement-item"><p>Loading announcements...</p></div>
          </div>
        </section>
      </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/app-icons.js"></script>
  </body>
</html>
