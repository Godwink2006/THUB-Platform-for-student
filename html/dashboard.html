<!doctype html>
<html lang="en" class="auth-welcome-open">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard | T-HUB</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="stylesheet" href="/css/app-visuals.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body class="dashboard-auth-checking">
    <div id="dashboardAuthLoading" class="dashboard-auth-loading" role="status" aria-live="polite">
      <div class="dashboard-auth-loading__content">
        <img class="dashboard-auth-loading__logo" src="/icons/app-icon-192.png" alt="" />
        <h1>T-HUB</h1>
      </div>
    </div>

    <div class="dashboard-container">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <aside class="sidebar">
        <div class="logo">
          <img id="appHeaderLogo" src="https://api.dicebear.com/7.x/initials/svg?seed=School" alt="School logo" />
          <h2>HSMS</h2>
        </div>
        <ul class="menu">
          <li class="active"><a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
          <li><a href="academics.html"><i class="fa-solid fa-book"></i><span>My Academics</span></a></li>
          <li><a href="my-timetable.html"><i class="fa-solid fa-calendar-days"></i><span>My Timetable</span></a></li>
          <li><a href="books.html"><i class="fa-solid fa-book-open"></i><span>Books</span></a></li>
          <li><a href="school-information.html"><i class="fa-solid fa-school"></i><span>School Information</span></a></li>
          <li><a href="notifications.html"><i class="fa-solid fa-bell"></i><span>Notifications</span><span id="notificationBadge" class="notification-badge" hidden></span></a></li>
          <li><a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
        </ul>
      </aside>

      <main class="dashboard-main-content">
        <header class="topbar">
          <div>
            <h1>Student Dashboard</h1>
            <p id="welcomeUserText">Welcome back...</p>
          </div>
          <div class="top-right">
            <button type="button" class="dashboard-theme-toggle app-theme-toggle" id="dashboardThemeToggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
              <i class="fa-solid fa-moon" aria-hidden="true"></i><span>Dark mode</span>
            </button>
          </div>
        </header>

        <section class="announcement-cards" aria-labelledby="announcementsHeading">
          <div class="card-header">
            <h3 id="announcementsHeading"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> School Announcements</h3>
          </div>
          <div class="announcement-preview" id="announcementPreviewContainer" aria-live="polite">
            <div class="announcement-item"><p>Loading announcements...</p></div>
          </div>
        </section>
      </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/spa-router.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/app-icons.js"></script>
  </body>
</html>
